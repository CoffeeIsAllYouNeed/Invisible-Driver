name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Add conda to system path
      run: |
        echo $CONDA/bin >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        conda env update --file environment.yml --name base

    - name: Lint with flake8
      run: |
        conda install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run ML Pipeline Tests & Generate Coverage Data
      run: |
        # This creates a hidden file (.coverage) containing all your metrics
        pytest --cov=src test_pipeline.py

    - name: Generate Coverage Badge Asset
      uses: tj-actions/coverage-badge-py@v2
      with:
        output: 'coverage.svg'
        overwrite: 'true'

    - name: Commit and Push Coverage Badge
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add coverage.svg
        git diff --staged --quiet || git commit -m "Updated code coverage badge"
        git push