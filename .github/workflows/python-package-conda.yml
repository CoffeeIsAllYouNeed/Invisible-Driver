name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    # Grants the GitHub runner permission to commit and push the badge back to your repo
    permissions:
      contents: write

    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Add conda to system path
      run: |
        # $CONDA is an environment variable pointing to the root of the miniconda directory
        echo $CONDA/bin >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        conda env update --file environment.yml --name base

    - name: Lint with flake8
      run: |
        conda install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run ML Pipeline Sanity Tests & Generate Coverage Data
      run: |
        # This creates a hidden file (.coverage) containing all your metrics
        pytest --cov=src test_pipeline.py

    - name: Generate Coverage Badge Asset
      run: |
        pip install "setuptools<70.0.0" coverage-badge
        coverage-badge -f -o coverage.svg

    - name: Commit and Push Coverage Badge
      run: |
        # Configures Git to match your personal account perfectly
        git config --local user.email "vrushalgithub2004@gmail.com"
        git config --local user.name "CoffeeIsAllYouNeed"
        
        git add coverage.svg
        # [skip ci] prevents an infinite pipeline loop
        git diff --staged --quiet || git commit -m "chore: update code coverage badge [skip ci]"
        git push