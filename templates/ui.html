<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invisible Driver - BCI Terminal</title>
    <style>
        :root {
            --bg-base: #050507;
            --bg-surface: #0e0e12;
            --border-subtle: #1c1c24;
            --text-main: #ffffff;
            --text-muted: #71717a;
            --accent-cyan: #00ffcc;
            --accent-blue: #3b82f6;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Left Side: Controls & Analytics */
        #hud-panel {
            width: 45%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            background: var(--bg-base);
            border-right: 1px solid var(--border-subtle);
            box-sizing: border-box;
            gap: 28px;
            overflow-y: auto;
        }

        .panel-title h1 { 
            color: var(--text-main); 
            margin: 0 0 4px 0; 
            font-size: 32px; 
            font-weight: 800;
            letter-spacing: -0.03em;
        }
        .panel-title p { margin: 0; color: var(--text-muted); font-size: 14px; }

        .btn-column { display: flex; flex-direction: column; gap: 12px; }
        button {
            width: 100%; padding: 16px; font-size: 14px; font-weight: 600;
            border: 1px solid var(--border-subtle); border-radius: 10px; cursor: pointer;
            transition: all 0.2s ease; color: var(--text-main); background: var(--bg-surface);
        }
        button:hover:not(:disabled) { 
            background: #181822;
            border-color: #3f3f46;
        }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .metrics-stack { display: flex; flex-direction: column; gap: 12px; }
        .metric-tile { 
            background: var(--bg-surface); 
            border: 1px solid var(--border-subtle); 
            padding: 18px; 
            border-radius: 12px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .tile-label { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
        .tile-value { font-size: 16px; font-weight: 700; color: var(--text-main); }
        
        .status-attentive { color: var(--accent-cyan) !important; }
        .status-relaxed { color: var(--accent-blue) !important; }

        .oscilloscope-box {
            height: 180px;
            background: var(--bg-surface);
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            position: relative;
        }
        #oscilloscopeCanvas { width: 100%; height: 100%; display: block; }
        .oscilloscope-tag { position: absolute; top: 15px; left: 15px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); z-index: 10; }

        /* Right Side: Arcade Display Window */
        #game-viewport {
            width: 55%;
            background: #09090b;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #arcadeCanvas {
            background: #111115;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 16px;
            display: block;
            border: 1px solid var(--border-subtle);
        }
    </style>
</head>
<body>

    <div id="hud-panel">
        <div class="panel-title">
            <h1>Invisible Driver</h1>
            <p>Drive car using brain</p>
        </div>
        
        <div class="btn-column">
            <button id="btn-hardware" onclick="connectPipeline('serial')">Run with Hardware</button>
            <button id="btn-simulation" onclick="connectPipeline('file')">Run Simulation</button>
        </div>

        <div class="metrics-stack">
            <div class="metric-tile">
                <div class="tile-label">Cognitive State</div>
                <div id="val-state" class="tile-value">Awaiting...</div>
            </div>
            <div class="metric-tile">
                <div class="tile-label">Throttle Profile</div>
                <div id="val-action" class="tile-value">None</div>
            </div>
            <div class="metric-tile">
                <div class="tile-label">EEG Reading</div>
                <div id="val-signal" class="tile-value">---</div>
            </div>
        </div>

        <div class="oscilloscope-box">
            <div class="oscilloscope-tag">Signal Graph Stream</div>
            <canvas id="oscilloscopeCanvas"></canvas>
        </div>
    </div>

    <div id="game-viewport">
        <canvas id="arcadeCanvas" width="400" height="550"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("arcadeCanvas");
        const ctx = canvas.getContext("2d");
        const oscCanvas = document.getElementById("oscilloscopeCanvas");
        const oscCtx = oscCanvas.getContext("2d");

        let socket = null;
        let signalHistory = [];
        const maxTraceSamples = 120;
        let globalCognitiveState = "RELAXED";

        // --- FIXED STRAIGHT LINE HIGHWAY ENGINE ---
        let car = { x: 177, y: 430, width: 45, height: 80, targetSpeed: 0, speed: 0, maxVelocity: 22 };
        let score = 0;
        let totalOdometer = 0;
        let animatedLineOffset = 0;

        function progressEngineTicks() {
            // Speed transitions
            car.speed += (car.targetSpeed - car.speed) * 0.05;
            totalOdometer += car.speed;
            animatedLineOffset = (animatedLineOffset + car.speed) % 80;

            if (car.speed > 1) {
                score += Math.floor(car.speed * 0.1);
            }

            // CAR POSITION FIX: Locked cleanly to centerline coordinates (no sway calculation)
            car.x = 177; 
        }

        function renderArcadeGraphics() {
            // Asphalt Track Base
            ctx.fillStyle = "#0e0e12";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Side Shoulders
            ctx.fillStyle = "#050507";
            ctx.fillRect(0, 0, 30, canvas.height);
            ctx.fillRect(canvas.width - 30, 0, 30, canvas.height);

            // Subtle dark curbing layout markers
            ctx.fillStyle = "#1c1c24"; 
            for(let y = (animatedLineOffset % 40) - 40; y < canvas.height; y += 40) {
                ctx.fillRect(25, y, 5, 20);
                ctx.fillRect(canvas.width - 30, y, 5, 20);
            }

            // Central lane dashed lines
            ctx.strokeStyle = "#3f3f46";
            ctx.lineWidth = 2;
            ctx.setLineDash([30, 50]);
            ctx.lineDashOffset = -animatedLineOffset;

            for (let x = 110; x < canvas.width - 100; x += 80) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            ctx.setLineDash([]); 

            // Draw Player Supercar chassis
            ctx.save();
            ctx.shadowBlur = car.speed > 5 ? 25 : 5;
            
            let colorAccent = (globalCognitiveState === "ATTENTIVE") ? lookupStyle('--accent-cyan') : lookupStyle('--accent-blue');
            ctx.shadowColor = colorAccent;
            ctx.fillStyle = colorAccent;
            
            ctx.beginPath();
            ctx.roundRect(car.x, car.y, car.width, car.height, 6);
            ctx.fill();
            ctx.restore();

            // Canopy glass elements
            ctx.fillStyle = "#050507";
            ctx.fillRect(car.x + 8, car.y + 22, car.width - 16, 25);
            ctx.fillStyle = "#ffffff"; 
            ctx.fillRect(car.x + car.width/2 - 1, car.y, 2, 12);

            // Dashboard Overlay fonts
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px monospace";
            ctx.fillText(`SCORE: ${score}`, 45, 45);
            ctx.font = "12px system-ui";
            ctx.fillStyle = lookupStyle('--text-muted');
            ctx.fillText(`SPEED: ${Math.round(car.speed * 12)} KM/H`, 45, 65);
        }

        // --- PIPELINE WEBSOCKET CORE HANDSHAKE ---
        function connectPipeline(streamMode) {
            document.getElementById('btn-hardware').disabled = true;
            document.getElementById('btn-simulation').disabled = true;
            
            car.speed = 0; car.targetSpeed = 0; score = 0; totalOdometer = 0;

            const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
            socket = new WebSocket(`${wsScheme}://${window.location.host}/pipeline_stream`);

            socket.onopen = function() {
                socket.send(JSON.stringify({ "command": "START", "mode": streamMode }));
            };

            socket.onmessage = function(event) {
                const packet = JSON.parse(event.data);
                
                globalCognitiveState = packet.state;
                
                const elementState = document.getElementById('val-state');
                elementState.innerText = packet.state;
                elementState.className = "tile-value " + (packet.state === "ATTENTIVE" ? "status-attentive" : "status-relaxed");

                document.getElementById('val-action').innerText = packet.action === "ACCELERATE" ? "THROTTLE ON" : "OFF (BRAKING)";
                document.getElementById('val-signal').innerText = packet.signal ? Number(packet.signal).toFixed(0) : "---";

                if (packet.signal !== undefined) {
                    signalHistory.push(Number(packet.signal));
                    if (signalHistory.length > maxTraceSamples) signalHistory.shift();
                }

                if (packet.action === "ACCELERATE") {
                    car.targetSpeed = car.maxVelocity;
                } else {
                    car.targetSpeed = 1;
                }
            };

            socket.onclose = function() {
                document.getElementById('btn-hardware').disabled = false;
                document.getElementById('btn-simulation').disabled = false;
            };
        }

        function lookupStyle(property) { 
            return getComputedStyle(document.documentElement).getPropertyValue(property).trim(); 
        }

        function scaleTraceViewport() {
            oscCanvas.width = oscCanvas.parentElement.clientWidth;
            oscCanvas.height = oscCanvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', scaleTraceViewport);
        scaleTraceViewport();

        function renderOscilloscope() {
            oscCtx.clearRect(0, 0, oscCanvas.width, oscCanvas.height);
            oscCtx.strokeStyle = "#161622";
            oscCtx.lineWidth = 1;
            for(let i = 1; i < 4; i++) {
                let currentY = (oscCanvas.height / 4) * i;
                oscCtx.beginPath(); oscCtx.moveTo(0, currentY); oscCtx.lineTo(oscCanvas.width, currentY); oscCtx.stroke();
            }
            if (signalHistory.length < 2) return;
            
            oscCtx.beginPath();
            oscCtx.strokeStyle = globalCognitiveState === "ATTENTIVE" ? lookupStyle('--accent-cyan') : lookupStyle('--accent-blue');
            oscCtx.lineWidth = 1.5;
            for (let i = 0; i < signalHistory.length; i++) {
                const targetX = (oscCanvas.width / (maxTraceSamples - 1)) * i;
                const targetY = oscCanvas.height - ((signalHistory[i] / 1023) * oscCanvas.height);
                if (i === 0) oscCtx.moveTo(targetX, targetY); else oscCtx.lineTo(targetX, targetY);
            }
            oscCtx.stroke();
        }

        function processingLoop() {
            progressEngineTicks();
            renderArcadeGraphics();
            renderOscilloscope();
            requestAnimationFrame(processingLoop);
        }
        processingLoop();
    </script>
</body>
</html>
